# 유튜브 편집 자동화 파이프라인 설정
# 각 단계(transcribe / broll / subtitle / render)가 공통으로 참조한다.

# ── 렌더 포맷 ──────────────────────────────────────────────
# 기본은 가로 1920x1080. 세로 쇼츠는 나중에 profiles 아래에 추가만 하면 됨.
render:
  # 활성 프로파일 (profiles 의 key 중 하나)
  active_profile: "landscape"

  profiles:
    landscape:
      width: 1920
      height: 1080
      fps: 30
      # 유튜브 롱폼 기본
      orientation: "horizontal"

    # 세로 쇼츠 — 구조만 잡아둠. active_profile 을 "shorts" 로 바꾸면 사용.
    shorts:
      width: 1080
      height: 1920
      fps: 30
      orientation: "vertical"

  # 최종 인코딩 옵션 (render.py 에서 사용)
  video_codec: "libx264"
  audio_codec: "aac"
  crf: 18              # 품질 (낮을수록 고화질, 18~23 권장)
  preset: "medium"
  pixel_format: "yuv420p"

# ── 전사 (transcribe.py) ──────────────────────────────────
transcribe:
  # faster-whisper 모델: tiny / base / small / medium / large-v3
  model: "small"
  language: "ko"        # None 으로 두면 자동 감지
  device: "cpu"         # "cuda" 사용 가능 시 변경
  compute_type: "int8"  # cpu: int8, gpu: float16
  # VAD 필터로 무음 구간 제거 (긴 침묵에서의 환각 완화)
  vad_filter: true
  beam_size: 5
  # 한국어 띄어쓰기 자동 교정 (Kiwi 형태소 분석기). 원문은 text_raw 로 보존.
  fix_spacing: true

# ── Anthropic (broll / subtitle 의 AI 판단) ────────────────
anthropic:
  model: "claude-sonnet-4-6"
  max_tokens: 2048
  # 판단 기준은 코드가 아니라 이 파일을 읽어 프롬프트에 넣는다.
  style_guide: "style_guide.md"

# ── B-roll (broll.py) ──────────────────────────────────────
broll:
  providers: ["pexels", "pixabay"]   # 검색 우선순위
  # 구간 길이(초)
  min_section_sec: 3
  max_section_sec: 8
  # B-roll 커버리지 (전체 발화 시간 대비) — 얼굴 노출과 번갈아 리듬
  min_coverage: 0.4
  max_coverage: 0.6
  # 구간당 후보 수
  candidates_per_section: 3
  # 검토 페이지 서버 포트
  review_port: 8787

# ── 자막 (subtitle.py) ─────────────────────────────────────
subtitle:
  # 프로젝트에 포함된 폰트 (assets/fonts/) — ffmpeg 굽기 시 fontsdir 로 지정
  # 채널 실사용 폰트: 에이투지체(A2Z). 본문은 Regular, 핵심(large)은 얇은 Light
  font_family_normal: "A2Z 4 Regular"
  font_family_large: "A2Z 3 Light"
  # 크기(px, 1080p 기준): AI가 문장별로 normal/large 중 선택
  # 채널 레퍼런스 실측 반영 — 얇고 작게, 화면에 떠 있는 느낌
  size_normal: 40
  size_large: 46
  # 기본 본문색 / 강조색 — 강조는 채널 시그니처 레몬 옐로 (기존 영상 실측값)
  base_color: "#FFFFFF"
  accent_color: "#FAFF2E"
  # 자막 한 개 최대 노출 시간(초) — 초과하는 긴 문장은 단어 타임스탬프로 분할
  max_cue_sec: 5.0
  # 자막 한 개 최대 글자수(공백 포함) — 항상 한 줄, 넘으면 여러 자막으로 분할
  max_chars_per_line: 20
  # ── 대형 키워드 타이포 (채널 시그니처 — 화면 중앙 디스플레이) ──
  displays_enabled: true
  # headline: 질문/핵심 구문 — 초대형 얇은 화이트
  display_headline_family: "A2Z 1 Thin"
  display_headline_size: 84
  # concept: 외국어 개념어·수치 — 볼드 옐로
  display_concept_family: "A2Z 5 Medium"
  display_concept_size: 64
  # 타이트 다크 박스 (레퍼런스 채널 공통 가독성 장치) — false 면 떠있는 스타일
  caption_box: true
  # 하단 안전영역: 화면 아래에서 이만큼 띄움 (px, 1080p 기준)
  margin_bottom: 110
  # 검토 표 서버 포트
  review_port: 8788

# ── 자료 사진 프레임 연출 (render.py) — 셜록현준/조승연 스타일 ──
photo_frame:
  enabled: true
  # 카드 높이 = 화면 높이 x 비율
  card_ratio: 0.74
  # 배경색: 자료 밝기에 따라 자동 선택
  bg_light: "#EFEAE3"   # 밝은 자료 → 웜 페이퍼
  bg_dark: "#16181D"    # 어두운 자료 → 딥 차콜
  # 얇은 흰 테두리(px, 1080p 기준)
  border: 6

# ── 인포그래픽 팔레트 (design_reference.md §15 — 2026-07-11 3차 재교체) ──
# 그래프/차트/스탯카드 전용 — 자료화면 프레임(§4, render.py photo_frame)과는 별개.
# Cleo Abram(순블랙+네온) → The B1M 1차(네이비 블루프린트+빈티지 종이+블루/레드)
# → The B1M 2차(라이트 오프화이트 캔버스+블루/그린, 지금 이 팔레트)로 재교체.
# 키 이름은 그대로 두고 값/의미만 바뀜: canvas_bg 는 이제 밝은 배경, point 는
# 이제 블루, surface 는 이제 그린(보조 강조).
# 주의(버그 수정 기록): canvas_bg/canvas_text 를 밝은 값으로 바꾸면서
# map_pin_blueprint()/map_data_markers() 처럼 "네이비 블루프린트"를 그대로
# 유지해야 하는 지도류 함수가 밝은 배경에 밝은 텍스트를 얹어(대비 없음)
# 텍스트가 안 보이는 회귀가 있었다 — 그래서 지도/블루프린트 전용 색을
# canvas_bg/canvas_text 와 분리해 blueprint_bg/blueprint_text 로 별도 지정.
infographic:
  canvas_bg: "#EEF1F6"       # 오프화이트 블루그레이 캔버스(카드 바깥 전체 배경, 이전엔 네이비였음)
  card_bg: "#FFFFFF"         # 캔버스 위에 얹는 흰 타일(스탯 강조 등, 이전엔 빈티지 페이퍼였음)
  point: "#3D5A96"           # 메인 강조색 — 미디엄 블루(이전엔 브릭 레드)
  surface: "#2E9E6B"         # 보조 강조색 — 그린(최신값/포지티브 강조, 이전엔 블루)
  highlight: "#7C8592"       # 보조 텍스트(뮤트 그레이, 이전엔 올리브그레이)
  text: "#1C2A38"            # 본문(다크 네이비) — 밝은 캔버스 위 기본 텍스트
  canvas_text: "#EDEFF4"     # (레거시) 라이트 캔버스 함수에서는 더 이상 안 씀 — 아래 참고
  blueprint_bg: "#16233A"    # 네이비 블루프린트 전용 배경(지도류 — map_pin_blueprint/map_data_markers)
  blueprint_text: "#EDEFF4"  # 네이비 블루프린트 배경 위 밝은 텍스트(지도류 전용)

# ── 로컬 웹앱 (app.py) ────────────────────────────────────
web:
  port: 8500
