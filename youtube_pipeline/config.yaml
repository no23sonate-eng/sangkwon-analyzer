# 유튜브 편집 자동화 파이프라인 설정
# 각 단계(transcribe / broll / subtitle / render)가 공통으로 참조한다.

# ── 렌더 포맷 ──────────────────────────────────────────────
# 기본은 가로 1920x1080. 세로 쇼츠는 나중에 profiles 아래에 추가만 하면 됨.
render:
  # 활성 프로파일 (profiles 의 key 중 하나)
  active_profile: "landscape"

  profiles:
    landscape:
      width: 1920
      height: 1080
      fps: 30
      # 유튜브 롱폼 기본
      orientation: "horizontal"

    # 세로 쇼츠 — 구조만 잡아둠. active_profile 을 "shorts" 로 바꾸면 사용.
    shorts:
      width: 1080
      height: 1920
      fps: 30
      orientation: "vertical"

  # 최종 인코딩 옵션 (render.py 에서 사용)
  video_codec: "libx264"
  audio_codec: "aac"
  crf: 18              # 품질 (낮을수록 고화질, 18~23 권장)
  preset: "medium"
  pixel_format: "yuv420p"

# ── 전사 (transcribe.py) ──────────────────────────────────
transcribe:
  # faster-whisper 모델: tiny / base / small / medium / large-v3
  model: "small"
  language: "ko"        # None 으로 두면 자동 감지
  device: "cpu"         # "cuda" 사용 가능 시 변경
  compute_type: "int8"  # cpu: int8, gpu: float16
  # VAD 필터로 무음 구간 제거 (긴 침묵에서의 환각 완화)
  vad_filter: true
  beam_size: 5
  # 한국어 띄어쓰기 자동 교정 (Kiwi 형태소 분석기). 원문은 text_raw 로 보존.
  fix_spacing: true

# ── Anthropic (broll / subtitle 의 AI 판단) ────────────────
anthropic:
  model: "claude-sonnet-4-6"
  max_tokens: 2048
  # 판단 기준은 코드가 아니라 이 파일을 읽어 프롬프트에 넣는다.
  style_guide: "style_guide.md"

# ── B-roll (broll.py) ──────────────────────────────────────
broll:
  providers: ["pexels", "pixabay"]   # 검색 우선순위
  # 구간 길이(초)
  min_section_sec: 3
  max_section_sec: 8
  # B-roll 커버리지 (전체 발화 시간 대비) — 얼굴 노출과 번갈아 리듬
  min_coverage: 0.4
  max_coverage: 0.6
  # 구간당 후보 수
  candidates_per_section: 3
  # 검토 페이지 서버 포트
  review_port: 8787

# ── 자막 (subtitle.py) ─────────────────────────────────────
subtitle:
  # 프로젝트에 포함된 폰트 (assets/fonts/) — ffmpeg 굽기 시 fontsdir 로 지정
  font_family: "Pretendard"
  font_file: "assets/fonts/Pretendard-Bold.otf"
  # 크기(px, 1080p 기준): AI가 문장별로 normal/large 중 선택
  size_normal: 60
  size_large: 76
  # 기본 본문색 / 강조색 (강조색은 브랜드 컬러 1색만 — style_guide)
  base_color: "#FFFFFF"
  accent_color: "#FFD84D"
  # 자막 한 개 최대 노출 시간(초) — 초과하는 긴 문장은 단어 타임스탬프로 분할
  max_cue_sec: 5.0
  # 한 줄 최대 글자수(공백 포함) — 초과 시 의미 단위에서 줄바꿈, 최대 2줄
  max_chars_per_line: 22
  # 하단 안전영역: 화면 아래에서 이만큼 띄움 (px, 1080p 기준)
  margin_bottom: 110
  # 검토 표 서버 포트
  review_port: 8788
