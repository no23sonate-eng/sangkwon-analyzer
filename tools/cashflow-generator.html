<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>캐쉬플로우 생성기 (standalone)</title>
<style>
  :root {
    --primary: #6366F1; --primary-600: #4F46E5; --primary-700: #4338CA;
    --primary-50: #EEF0FE; --gray-50: #F9FAFB; --gray-100: #F3F4F6;
    --gray-200: #E5E7EB; --gray-400: #9CA3AF; --gray-500: #6B7280;
    --gray-600: #4B5563; --gray-700: #374151; --gray-900: #111827;
    --emerald-50: #ECFDF5; --emerald-700: #047857;
    --amber-50: #FFFBEB; --amber-200: #FDE68A; --amber-700: #B45309; --amber-800: #92400E;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: var(--gray-50); color: var(--gray-900); font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 24px; }
  h1 { font-size: 22px; font-weight: 700; }
  .sub { font-size: 13px; color: var(--gray-500); margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 400px 1fr; gap: 20px; margin-top: 20px; }
  @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
  .col { display: flex; flex-direction: column; gap: 16px; }
  .card { border: 1px solid var(--gray-100); background: #fff; border-radius: 12px; padding: 16px; }
  .sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .step { width: 20px; height: 20px; border-radius: 50%; background: var(--primary-600); color: #fff;
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
  .sec-head h3 { font-size: 13px; font-weight: 600; }
  .card h3.title { font-size: 13px; font-weight: 600; margin-bottom: 8px; }
  .catgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .catbtn { display: flex; align-items: center; gap: 8px; border: 1px solid var(--gray-200); border-radius: 8px;
    padding: 10px 12px; font-size: 13px; font-weight: 500; color: var(--gray-600); background: #fff; cursor: pointer; transition: .15s; }
  .catbtn:hover { border-color: var(--gray-400); }
  .catbtn.on { border-color: var(--primary-600); background: var(--primary-50); color: var(--primary-700); }
  .moderow { display: flex; gap: 8px; margin-top: 8px; }
  .moderow .catbtn { flex: 1; justify-content: center; }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .field label { font-size: 12px; color: var(--gray-600); }
  .field .hint { margin-left: 4px; font-size: 9px; padding: 1px 4px; border-radius: 4px; }
  .field input { width: 120px; border: 1px solid var(--gray-200); border-radius: 6px; padding: 4px 8px;
    text-align: right; font-size: 12px; font-variant-numeric: tabular-nums; }
  .field input:focus { outline: none; border-color: var(--primary-600); }
  .trow { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
  .trow .tlabel { width: 34px; font-size: 12px; font-weight: 500; color: var(--gray-600); }
  .numbox { flex: 1; display: flex; align-items: center; border: 1px solid var(--gray-200); border-radius: 6px; padding: 4px 6px; }
  .numbox input { width: 100%; border: none; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }
  .numbox input:focus { outline: none; }
  .numbox .suf { margin-left: 2px; font-size: 9px; color: var(--gray-400); }
  .note { margin-top: 4px; font-size: 11px; color: var(--gray-400); }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  @media (max-width: 640px) { .kpis { grid-template-columns: 1fr 1fr; } }
  .kpi { border: 1px solid var(--gray-100); background: #fff; border-radius: 12px; padding: 12px; }
  .kpi.hi { border-color: #C7CCFB; background: var(--primary-50); }
  .kpi .l { font-size: 11px; color: var(--gray-500); }
  .kpi .v { font-size: 17px; font-weight: 700; }
  .kpi.hi .v { color: var(--primary-700); }
  .kpi .s { font-size: 10px; color: var(--gray-400); }
  .warns { border: 1px solid var(--amber-200); background: var(--amber-50); border-radius: 12px; padding: 12px; }
  .warns div { font-size: 12px; color: var(--amber-800); padding: 2px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .tic td { padding: 4px 0; border-bottom: 1px solid var(--gray-100); vertical-align: top; }
  .tic .cat { width: 76px; font-size: 11px; color: var(--gray-400); }
  .tic .amt { text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  .tic .formula { font-size: 10px; color: var(--gray-400); }
  .tic .total td { border-top: 2px solid var(--gray-200); font-weight: 700; padding-top: 6px; }
  .tic .total .amt { color: var(--primary-600); }
  .badge { margin-left: 6px; padding: 1px 4px; border-radius: 4px; font-size: 9px; }
  .b학습 { background: var(--emerald-50); color: var(--emerald-700); }
  .b추정 { background: var(--amber-50); color: var(--amber-700); }
  .b입력 { background: var(--primary-50); color: var(--primary-700); }
  .rows > div { display: flex; justify-content: space-between; padding: 3px 0; color: var(--gray-600); }
  .rows .bold { border-top: 1px solid var(--gray-100); padding-top: 6px; font-weight: 600; color: var(--gray-900); }
  .rows .muted { color: var(--gray-400); }
  .rows span:last-child { font-variant-numeric: tabular-nums; }
  .optbl th { font-size: 10px; color: var(--gray-400); font-weight: 400; text-align: right; padding-bottom: 4px; }
  .optbl th:first-child { text-align: left; }
  .optbl td { padding: 4px 0; border-bottom: 1px solid var(--gray-100); font-variant-numeric: tabular-nums; text-align: right; }
  .optbl td:first-child { text-align: left; }
  .optbl tr.base { background: rgba(99,102,241,.06); font-weight: 500; }
  .lirr { color: var(--primary-600); font-weight: 600; }
  .asum { border-bottom: 1px solid var(--gray-100); padding: 6px 0; }
  .asum .h { font-weight: 500; color: var(--gray-700); }
  .asum .t { font-size: 11px; color: var(--gray-500); }
  .asum .src { font-size: 10px; color: var(--gray-400); }
  .foot { margin-top: 24px; font-size: 11px; color: var(--gray-400); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>캐쉬플로우 생성기</h1>
  <div class="sub">카테고리·면적만 정하면 학습된 요율로 TIC·조달·운영·Exit·수익률을 자동 산출합니다. (오프라인 단독 실행 · 상권분석기와 분리)</div>
  <div class="grid">
    <div class="col" id="inputs"></div>
    <div class="col" id="results"></div>
  </div>
  <div class="foot">
    요율 근거: 실전 재무모델 4건 학습 (BRIX 730 · Cash Flow v5.2 · Project soho · WORKSTAY).
    <span class="badge b학습">학습</span> 모델 인용 ·
    <span class="badge b추정">추정</span> 근거 없음(검증 필요) ·
    <span class="badge b입력">입력</span> 직접 입력값. 이 파일은 단독 실행용 프로토타입입니다.
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   캐쉬플로우 엔진 — web/lib/cashflow/{defaults,engine}.ts 포팅
   단위: 내부 계산 백만원. 입력 단가 만원/평(×0.01=MAN_TO_MM), ADR 원.
   ═══════════════════════════════════════════════════════════ */
const MM = 0.01; // 만원 → 백만원

const CATEGORY_LABEL = { office:"오피스", retail:"리테일", hotel:"호텔", senior:"시니어 레지던스" };
const CATEGORY_ICON  = { office:"🏢", retail:"🛍️", hotel:"🏨", senior:"🏥" };
const DEV_MODE_LABEL = { dev:"신축 개발", valueadd:"매입 + 리모델링 (밸류애드)" };

const RATES = {
  acqTaxLand: 0.046, acqTaxBuildingNew: 0.0316, acqTaxRenovation: 0.022,
  constContingency: 0.05, projContingency: 0.0184,
  designPerPy: 25, supervisionPerPy: 12, utilityConnPerPy: 21,
  amcMgmtAnnual: 0.005, trustFee: 0.015, professionalFees: 0.006,
  saleCost: 0.01, saleBaseFee: 0.007, leasingCommission: 2.5,
  escalation: 0.025, holdingTaxOnTic: 0.002, advisory: 0.012,
};

const CATEGORY_DEFAULTS = {
  office: {
    efficiency: 0.55, landPricePerPy: 5000, farAssumed: 8,
    constCostPerPy: { dev: 1100, valueadd: 450 },
    rentPerPyMonthly: 20, mgmtFeePerPy: 6, vacancy: 0.05,
    opexRatio: 0.15, rampup: [0.7,0.9,1.0], rentFreeMonths: 3, exitCap: 0.045,
    schedule: { permit: 12, constDev: 30, constValueadd: 10, ops: 24 },
  },
  retail: {
    efficiency: 0.6, landPricePerPy: 7000, farAssumed: 5,
    constCostPerPy: { dev: 1000, valueadd: 500 },
    rentPerPyMonthly: 20, mgmtFeePerPy: 3, vacancy: 0.03,
    opexRatio: 0.12, rampup: [0.55,0.85,1.0], rentFreeMonths: 6, exitCap: 0.05,
    schedule: { permit: 12, constDev: 24, constValueadd: 10, ops: 24 },
  },
  hotel: {
    efficiency: 0.68, landPricePerPy: 5000, farAssumed: 6,
    constCostPerPy: { dev: 1200, valueadd: 512 },
    gfaPerRoom: 20, adr: 250000, occStabilized: 0.88, roomRevShare: 0.38, ancillaryRatio: 0.25,
    opexRatio: 0.1, rampup: [0.76,0.88,0.98,1.0], rentFreeMonths: 6, exitCap: 0.055,
    schedule: { permit: 12, constDev: 30, constValueadd: 10, ops: 36 },
  },
  senior: {
    efficiency: 0.75, landPricePerPy: 4000, farAssumed: 4,
    constCostPerPy: { dev: 1730, valueadd: 600 },
    gfaPerUnit: 108, depositPerUnit: 5200, monthlyFeePerUnit: 800, occupancy: 0.95, depositYield: 0.03,
    opexRatio: 0.82, rampup: [0.6,0.85,1.0], rentFreeMonths: 0, exitCap: 0.045,
    schedule: { permit: 12, constDev: 35, constValueadd: 12, ops: 24 },
  },
};
const FIN = {
  equityRatio: 0.25,
  trancheA: { ratio: 0.55, rate: 0.062, upfront: 0.011 },
  trancheB: { ratio: 0.12, rate: 0.075, upfront: 0.036 },
  trancheC: { ratio: 0.08, rate: 0.093, upfront: 0 },
};

function buildDefaultInput(category, devMode) {
  const d = CATEGORY_DEFAULTS[category];
  const gfaPy = category === "senior" ? 12000 : 3000;
  const landPy = Math.round(gfaPy / d.farAssumed);
  const base = {
    category, devMode, landPy, gfaPy, efficiency: d.efficiency,
    landPricePerPy: d.landPricePerPy, constCostPerPy: d.constCostPerPy[devMode],
    equityRatio: FIN.equityRatio,
    trancheA: { amountRatio: FIN.trancheA.ratio, rate: FIN.trancheA.rate, upfront: FIN.trancheA.upfront },
    trancheB: { amountRatio: FIN.trancheB.ratio, rate: FIN.trancheB.rate, upfront: FIN.trancheB.upfront },
    trancheC: { amountRatio: FIN.trancheC.ratio, rate: FIN.trancheC.rate, upfront: FIN.trancheC.upfront },
    permitMonths: d.schedule.permit,
    constMonths: devMode === "dev" ? d.schedule.constDev : d.schedule.constValueadd,
    opsMonths: d.schedule.ops, exitCap: d.exitCap,
  };
  if (category === "office" || category === "retail") {
    base.rentPerPyMonthly = d.rentPerPyMonthly; base.mgmtFeePerPy = d.mgmtFeePerPy;
  } else if (category === "hotel") {
    base.roomCount = Math.round(gfaPy / d.gfaPerRoom); base.adr = d.adr;
  } else {
    base.unitCount = Math.round(gfaPy / d.gfaPerUnit);
    base.depositPerUnit = d.depositPerUnit; base.monthlyFeePerUnit = d.monthlyFeePerUnit;
  }
  return base;
}

function sCurveWeights(n) {
  const raw = Array.from({length:n}, (_,i)=>Math.sin((Math.PI*(i+0.5))/n));
  const sum = raw.reduce((a,b)=>a+b,0);
  return raw.map(w=>w/sum);
}
function irr(cfs, ppy=12) {
  const hasNeg = cfs.some(c=>c<-1e-9), hasPos = cfs.some(c=>c>1e-9);
  if (!hasNeg || !hasPos) return null;
  const npv = r => cfs.reduce((a,c,t)=>a+c/Math.pow(1+r,t),0);
  let lo=-0.95/ppy, hi=1.5/ppy, fLo=npv(lo), fHi=npv(hi);
  if (fLo*fHi>0) return null;
  for (let i=0;i<200;i++){ const mid=(lo+hi)/2, fMid=npv(mid);
    if (Math.abs(fMid)<1e-7||hi-lo<1e-10) break;
    if (fLo*fMid<=0) hi=mid; else { lo=mid; fLo=fMid; } }
  const rM=(lo+hi)/2; return Math.pow(1+rM,ppy)-1;
}

function buildOpsModel(input) {
  const d = CATEGORY_DEFAULTS[input.category];
  const notes = [];
  const netPy = input.gfaPy * input.efficiency;
  let gor = 0, depositInflow = 0;
  if (input.category==="office" || input.category==="retail") {
    const rent=(input.rentPerPyMonthly||0)*MM, mgmt=(input.mgmtFeePerPy||0)*MM, vac=d.vacancy||0.05;
    gor = netPy*(rent+mgmt)*12*(1-vac);
    notes.push({label:"임대수입", text:`전용 ${Math.round(netPy).toLocaleString()}평 × (임대료 ${input.rentPerPyMonthly}만 + 관리비 ${input.mgmtFeePerPy}만)/평/월 × (1-공실 ${(vac*100).toFixed(0)}%)`, basis:"추정"});
  } else if (input.category==="hotel") {
    const rooms=input.roomCount||0, adrMm=(input.adr||0)/1e6, occ=d.occStabilized||0.88;
    const roomRev=rooms*adrMm*365*occ, totalRev=roomRev*(1+(d.ancillaryRatio||0.25));
    gor = totalRev*(d.roomRevShare||0.38);
    notes.push({label:"호텔 임대수입 (마스터리스)", text:`객실 ${rooms}실 × ADR ${(input.adr||0).toLocaleString()}원 × OCC ${(occ*100).toFixed(0)}% × 365 × (1+부대 ${((d.ancillaryRatio||0)*100).toFixed(0)}%) × 연동율 ${((d.roomRevShare||0)*100).toFixed(0)}%`, basis:"학습", src:"workstay — MAX(MRG,매출연동)의 연동부만 적용(보수적)"});
  } else {
    const units=input.unitCount||0, occ=d.occupancy||0.95;
    const depositTotal=units*(input.depositPerUnit||0)*occ;
    const feeRev=units*(input.monthlyFeePerUnit||0)*MM*12*occ, depositRev=depositTotal*(d.depositYield||0.03);
    gor = feeRev+depositRev; depositInflow=depositTotal;
    notes.push({label:"시니어 수입", text:`${units}세대 × 입주율 ${(occ*100).toFixed(0)}% — 이용료 ${input.monthlyFeePerUnit}만/월 + 보증금 ${((input.depositPerUnit||0)/100).toFixed(0)}억/세대 × 운용 ${((d.depositYield||0)*100).toFixed(1)}%`, basis:"학습", src:"brix730 — 보증금은 입주 시 유입·매각 시 승계(차감). 간이 로직"});
  }
  const opexRatio = d.opexRatio;
  notes.push({label:"운영비용", text:`GOR의 ${(opexRatio*100).toFixed(0)}%`, basis:"추정"});
  return { stabilizedGor:gor, stabilizedNoi:gor*(1-opexRatio), opexRatio,
    rampup:d.rampup, rentFreeMonths:d.rentFreeMonths, depositInflow,
    depositModel: input.category==="senior", notes };
}

function buildTic(input, financeCost, ops) {
  const L = [];
  const push = (cat,name,amt,formula,basis,src) => { if (Math.abs(amt)<0.5) return;
    L.push({category:cat,name,amount:Math.round(amt),formula,basis,src}); };
  const land = input.landPy*input.landPricePerPy*MM;
  const isVA = input.devMode==="valueadd";
  push("토지관련비", isVA?"매입가 (토지+건물)":"토지비", land, `${input.landPy.toLocaleString()}평 × ${input.landPricePerPy.toLocaleString()}만원/평`, "입력");
  push("토지관련비","취득세 등", land*RATES.acqTaxLand, "매입가 × 4.6%", "학습");
  push("토지관련비","채권할인·법무사 등", land*0.003, "매입가 × 0.3%", "추정");
  const direct = input.gfaPy*input.constCostPerPy*MM;
  push("공사비(직접)","도급공사비", direct, `연면적 ${input.gfaPy.toLocaleString()}평 × ${input.constCostPerPy.toLocaleString()}만원/평`, "입력");
  const contingency = direct*RATES.constContingency;
  push("공사비(직접)","공사예비비", contingency, "도급공사비 × 5%", "학습");
  const utilConn = input.gfaPy*RATES.utilityConnPerPy*MM;
  push("공사비(직접)","인입공사비", utilConn, "연면적 × 21만원/평", "학습");
  const design = input.gfaPy*RATES.designPerPy*MM, supervision = input.gfaPy*RATES.supervisionPerPy*MM;
  push("공사비(간접)","설계비", design, "연면적 × 25만원/평", "학습");
  push("공사비(간접)","감리·CM", supervision, "연면적 × 12만원/평", "학습");
  const levies = direct*0.006;
  push("공사비(간접)","각종부담금", levies, "도급공사비 × 0.6%", "학습");
  const constTotal = direct+contingency+utilConn+design+supervision+levies;
  const acqBldg = isVA ? constTotal*RATES.acqTaxRenovation : (constTotal+financeCost)*RATES.acqTaxBuildingNew;
  push("부대비·제세", isVA?"취득세 (대수선 2.2%)":"취득세 (원시취득 3.16%)", acqBldg, isVA?"공사비 × 2.2%":"(공사비+금융비) × 3.16%", "학습");
  const projCont = (land+constTotal)*RATES.projContingency;
  push("부대비·제세","사업예비비", projCont, "(토지+공사비) × 1.84%", "학습");
  const devMonths = input.permitMonths+input.constMonths;
  const holdingTax = (land+constTotal)*RATES.holdingTaxOnTic*(devMonths/12);
  push("부대비·제세","개발기간 보유세 등", holdingTax, `(토지+공사비) × 연 0.2% × ${devMonths}개월`, "추정");
  const professional = (land+constTotal)*RATES.professionalFees;
  push("용역수수료","법률·세무·감평·시장조사 등", professional, "(토지+공사비) × 0.6%", "추정");
  const amc = (land+constTotal)*RATES.amcMgmtAnnual*(devMonths/12);
  push("SPC·AMC","AMC 운용보수", amc, `(토지+공사비) × 연 0.5% × ${devMonths}개월`, "학습");
  const trust = (land+constTotal)*RATES.trustFee;
  push("SPC·AMC","신탁수수료 등", trust, "(토지+공사비) × 1.5%", "학습");
  if (input.category!=="senior") {
    push("임대안정화","임대수수료", (ops.stabilizedGor/12)*RATES.leasingCommission, "신규계약 월임대료 × 250%", "학습");
  }
  push("금융비용","이자·선취·자문 (시뮬레이션)", financeCost, "월별 CF 조달 시뮬레이션 산출", "학습");
  const total = L.reduce((a,b)=>a+b.amount,0);
  return { lines:L, total };
}

function simulate(input, tic, ops, exitCap) {
  const pm=input.permitMonths, cm=input.constMonths, om=input.opsMonths, total=pm+cm+om;
  const isVA = input.devMode==="valueadd";
  const equityCap = tic*input.equityRatio;
  const tranches = [
    {cap:tic*input.trancheA.amountRatio, rate:input.trancheA.rate, upfront:input.trancheA.upfront, bal:0},
    {cap:tic*input.trancheB.amountRatio, rate:input.trancheB.rate, upfront:input.trancheB.upfront, bal:0},
    {cap:tic*input.trancheC.amountRatio, rate:input.trancheC.rate, upfront:input.trancheC.upfront, bal:0},
  ];
  const capexByMonth = new Array(total).fill(0);
  const land = input.landPy*input.landPricePerPy*MM;
  const landCosts = land*(1+RATES.acqTaxLand+0.003);
  const direct = input.gfaPy*input.constCostPerPy*MM;
  const constDirect = direct*(1+RATES.constContingency) + input.gfaPy*RATES.utilityConnPerPy*MM;
  const indirect = input.gfaPy*(RATES.designPerPy+RATES.supervisionPerPy)*MM + direct*0.006;
  const constTotal = constDirect+indirect;
  const softMonthly = (land+constTotal)*(RATES.projContingency + RATES.holdingTaxOnTic*((pm+cm)/12) + RATES.professionalFees + RATES.amcMgmtAnnual*((pm+cm)/12) + RATES.trustFee)/(pm+cm);
  const acqBldg = isVA ? constTotal*RATES.acqTaxRenovation : NaN;
  if (isVA) capexByMonth[0]+=landCosts;
  else { capexByMonth[0]+=landCosts*0.1; capexByMonth[pm-1]+=landCosts*0.9; }
  const sw = sCurveWeights(cm);
  for (let i=0;i<cm;i++) capexByMonth[pm+i]+=constDirect*sw[i]+indirect/cm;
  for (let i=0;i<pm+cm;i++) capexByMonth[i]+=softMonthly;
  const acqBldgFinal = isVA ? acqBldg : constTotal*RATES.acqTaxBuildingNew*1.1;
  capexByMonth[pm+cm-1]+=acqBldgFinal;
  if (input.category!=="senior") capexByMonth[pm+cm]=(capexByMonth[pm+cm]||0)+(ops.stabilizedGor/12)*RATES.leasingCommission;
  const drawMonth = isVA?0:pm-1;
  const upfrontTotal = tranches.reduce((a,t)=>a+t.cap*t.upfront,0) + tranches.reduce((a,t)=>a+t.cap,0)*RATES.advisory;
  capexByMonth[drawMonth]+=upfrontTotal;

  const revByMonth=new Array(total).fill(0), opexByMonth=new Array(total).fill(0);
  const esc = RATES.escalation;
  for (let i=0;i<om;i++){ const m=pm+cm+i, oy=Math.floor(i/12);
    const ramp=ops.rampup[Math.min(oy,ops.rampup.length-1)], rf=i<ops.rentFreeMonths?0:1;
    const gorM=(ops.stabilizedGor/12)*ramp*rf*Math.pow(1+esc,oy);
    revByMonth[m]=gorM; opexByMonth[m]=gorM*ops.opexRatio; }
  const exitYears=Math.ceil(om/12), fwdNoi=ops.stabilizedNoi*Math.pow(1+esc,exitYears);
  const salePrice=fwdNoi/exitCap, saleCosts=salePrice*(RATES.saleCost+RATES.saleBaseFee);

  const monthly=[]; let equityUsed=0, fundingGap=0, interestTotal=0, cash=0, opsNoiTotal=0;
  const unleveredCfs=[], leveredCfs=[], dscrs=[];
  for (let m=0;m<total;m++){
    const phase = m<pm?"인허가":m<pm+cm?"공사":m===total-1?"매각":"운영";
    const capex=capexByMonth[m], rev=revByMonth[m], opex=opexByMonth[m];
    let interest=0; for (const t of tranches) interest+=t.bal*(t.rate/12); interestTotal+=interest;
    let loanRepay=0, depositIn=0;
    if (ops.depositInflow>0 && m===pm+cm){ depositIn=ops.depositInflow; let avail=depositIn;
      for (const t of [...tranches].reverse()){ const rp=Math.min(t.bal,avail); t.bal-=rp; avail-=rp; loanRepay+=rp; } cash+=avail; }
    let need=capex+interest+opex-rev, equityDraw=0, loanDraw=0;
    if (need>0){ const fromCash=Math.min(cash,need); cash-=fromCash; need-=fromCash;
      equityDraw=Math.min(equityCap-equityUsed,need); equityUsed+=equityDraw; need-=equityDraw;
      for (const t of tranches){ if (need<=0) break; const draw=Math.min(t.cap-t.bal,need); t.bal+=draw; loanDraw+=draw; need-=draw; }
      if (need>1e-6){ fundingGap+=need; need=0; }
    } else cash+=-need;
    let saleNet=0;
    if (m===total-1){ saleNet = ops.depositModel?0:salePrice-saleCosts-ops.depositInflow;
      let avail=saleNet+cash; cash=0;
      for (const t of [...tranches].reverse()){ const rp=Math.min(t.bal,avail); t.bal-=rp; avail-=rp; loanRepay+=rp; } cash=avail; }
    const bal=tranches.reduce((a,t)=>a+t.bal,0);
    if (phase==="운영"||phase==="매각") opsNoiTotal+=rev-opex;
    if (phase==="운영" && interest>0 && rev>0) dscrs.push((rev-opex)/interest);
    const capexExFin = capex-(m===drawMonth?upfrontTotal:0);
    const exitInflow = (m===total-1 && !ops.depositModel)?salePrice-saleCosts-ops.depositInflow:0;
    unleveredCfs.push(-capexExFin+(rev-opex)+exitInflow+depositIn);
    leveredCfs.push(-equityDraw+(m===total-1?cash:0));
    monthly.push({month:m+1, phase, loanBalance:Math.round(bal)});
  }
  return { monthly, interestTotal, financeCost:interestTotal+upfrontTotal,
    equityUsed, fundingGap, opsNoiTotal, unleveredCfs, leveredCfs, dscrs };
}

function computeCashflow(input) {
  const ops = buildOpsModel(input);
  let financeCost=0, tic=0;
  for (let i=0;i<5;i++){ const t=buildTic(input,financeCost,ops); tic=t.total;
    const s=simulate(input,tic,ops,input.exitCap);
    if (Math.abs(s.financeCost-financeCost)<1){ financeCost=s.financeCost; break; }
    financeCost=s.financeCost; }
  const ticBuild=buildTic(input,financeCost,ops); tic=ticBuild.total;
  const finalSim=simulate(input,tic,ops,input.exitCap);
  const esc=RATES.escalation, exitYears=Math.ceil(input.opsMonths/12);
  const caps = ops.depositModel ? [input.exitCap]
    : [input.exitCap-0.005,input.exitCap,input.exitCap+0.005].filter(c=>c>0.01);
  const exits = caps.map(cap=>{
    const s=simulate(input,tic,ops,cap);
    const fwdNoi=ops.stabilizedNoi*Math.pow(1+esc,exitYears);
    const salePrice=ops.depositModel?ops.depositInflow:fwdNoi/cap;
    const saleCosts=ops.depositModel?0:salePrice*(RATES.saleCost+RATES.saleBaseFee);
    const profit=(salePrice-saleCosts)+s.opsNoiTotal-tic;
    const uIrr=irr(s.unleveredCfs), lIrr=irr(s.leveredCfs);
    const eqIn=s.leveredCfs.filter(c=>c<0).reduce((a,b)=>a-b,0);
    const eqOut=s.leveredCfs.filter(c=>c>0).reduce((a,b)=>a+b,0);
    return { cap, salePrice:Math.round(salePrice), profit:Math.round(profit),
      profitMargin: tic>0?profit/tic:0, unleveredIrr:uIrr, leveredIrr:lIrr,
      equityMultiple: eqIn>0?eqOut/eqIn:null };
  });
  const yearlyOps=[];
  for (let y=0;y<Math.ceil(input.opsMonths/12);y++){
    const ramp=ops.rampup[Math.min(y,ops.rampup.length-1)];
    const months=Math.min(12,input.opsMonths-y*12);
    const rfAdj=y===0?Math.max(0,months-ops.rentFreeMonths)/months:1;
    const gor=ops.stabilizedGor*(months/12)*ramp*rfAdj*Math.pow(1+esc,y);
    yearlyOps.push({year:y+1, gor:Math.round(gor), noi:Math.round(gor*(1-ops.opexRatio)), rampup:ramp});
  }
  const warnings=[];
  if (finalSim.fundingGap>0) warnings.push(`조달 부족 ${Math.round(finalSim.fundingGap).toLocaleString()}백만원 — Equity 비율 또는 트랜치 한도를 올리세요.`);
  const dscrMin=finalSim.dscrs.length?Math.min(...finalSim.dscrs):null;
  if (dscrMin!==null && dscrMin<1) warnings.push(`운영기간 최소 DSCR ${dscrMin.toFixed(2)} < 1.0 — 램프업 구간 이자 부족 (soho도 min 0.887, 학습 모델 관행상 매각차익으로 해소).`);
  if (input.category==="senior") warnings.push("시니어는 간이 로직(보증금 승계 차감형) — 분양형 정밀 모델(계좌 워터폴)은 별도.");
  const est=ticBuild.lines.filter(l=>l.basis==="추정").map(l=>l.name);
  if (est.length) warnings.push(`추정 항목(학습 근거 없음): ${est.join(", ")} — 실제 견적으로 검증 필요.`);
  const tr=[
    {name:"Tr.A", amount:Math.round(tic*input.trancheA.amountRatio), rate:input.trancheA.rate, upfront:input.trancheA.upfront},
    {name:"Tr.B", amount:Math.round(tic*input.trancheB.amountRatio), rate:input.trancheB.rate, upfront:input.trancheB.upfront},
    {name:"Tr.C", amount:Math.round(tic*input.trancheC.amountRatio), rate:input.trancheC.rate, upfront:input.trancheC.upfront},
  ].filter(t=>t.amount>0);
  const totalDebt=tr.reduce((a,t)=>a+t.amount,0);
  return { input, assumptions:ops.notes, tic:ticBuild.lines, ticTotal:Math.round(tic),
    ticPerGfaPy:Math.round((tic/input.gfaPy)*100),
    financing:{ equity:Math.round(finalSim.equityUsed), tranches:tr, totalDebt, ltc:totalDebt/tic, interestTotal:Math.round(finalSim.interestTotal) },
    yearlyOps, stabilizedNoi:Math.round(ops.stabilizedNoi), yieldOnCost:ops.stabilizedNoi/tic,
    dscr: finalSim.dscrs.length?{min:Math.min(...finalSim.dscrs), avg:finalSim.dscrs.reduce((a,b)=>a+b,0)/finalSim.dscrs.length}:null,
    exits, warnings };
}

/* ═══════════════ UI ═══════════════ */
const mm = v => { if (v==null||isNaN(v)) return "-"; const a=Math.abs(v), s=v<0?"-":"";
  if (a>=1e6) return `${s}${(a/1e6).toFixed(2)}조원`;
  if (a>=100) return `${s}${Math.round(a/100).toLocaleString()}억원`;
  return `${s}${Math.round(a).toLocaleString()}백만`; };
const pct = (v,d=1) => (v==null||!isFinite(v))?"-":`${(v*100).toFixed(d)}%`;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

let CAT="office", MODE="dev", INPUT=buildDefaultInput("office","dev");

function reset(cat, mode){ CAT=cat; MODE=mode; INPUT=buildDefaultInput(cat,mode); renderAll(); }
function patch(p){ Object.assign(INPUT,p); renderResults(); }
function patchT(k,p){ Object.assign(INPUT[k],p); renderResults(); }

function fieldHtml(label, val, key, step, hint){
  const badge = hint?`<span class="hint b${hint}">${hint}</span>`:"";
  return `<div class="field"><label>${label}${badge}</label>
    <input type="number" value="${val}" step="${step||1}" data-key="${key}"></div>`;
}
function renderInputs(){
  const d = CATEGORY_DEFAULTS[CAT];
  let reqFields = "";
  if (CAT==="office"||CAT==="retail") reqFields =
    fieldHtml("임대료 (만원/전용평/월)", INPUT.rentPerPyMonthly, "rentPerPyMonthly", 1, "추정") +
    fieldHtml("관리비 (만원/전용평/월)", INPUT.mgmtFeePerPy, "mgmtFeePerPy", 1, "추정");
  else if (CAT==="hotel") reqFields =
    fieldHtml("객실수", INPUT.roomCount, "roomCount") +
    fieldHtml("ADR (원/박)", INPUT.adr, "adr", 5000, "추정");
  else reqFields =
    fieldHtml("세대수", INPUT.unitCount, "unitCount") +
    fieldHtml("세대당 보증금 (백만원)", INPUT.depositPerUnit, "depositPerUnit", 100, "학습") +
    fieldHtml("세대당 월 이용료 (만원)", INPUT.monthlyFeePerUnit, "monthlyFeePerUnit", 1, "학습");

  const catBtns = Object.keys(CATEGORY_LABEL).map(c=>
    `<button class="catbtn ${CAT===c?'on':''}" data-cat="${c}"><span>${CATEGORY_ICON[c]}</span> ${CATEGORY_LABEL[c]}</button>`).join("");
  const modeBtns = Object.keys(DEV_MODE_LABEL).map(m=>
    `<button class="catbtn ${MODE===m?'on':''}" data-mode="${m}">${DEV_MODE_LABEL[m]}</button>`).join("");
  const trHtml = (label,t,k)=>`<div class="trow"><span class="tlabel">${label}</span>
    <div class="numbox"><input type="number" value="${Math.round(t.amountRatio*100)}" data-tk="${k}" data-tf="amountRatio" data-div="100"><span class="suf">%</span></div>
    <div class="numbox"><input type="number" step="0.1" value="${(t.rate*100).toFixed(1)}" data-tk="${k}" data-tf="rate" data-div="100"><span class="suf">%금리</span></div>
    <div class="numbox"><input type="number" step="0.1" value="${(t.upfront*100).toFixed(1)}" data-tk="${k}" data-tf="upfront" data-div="100"><span class="suf">%선취</span></div></div>`;
  const sumPct = Math.round((INPUT.equityRatio+INPUT.trancheA.amountRatio+INPUT.trancheB.amountRatio+INPUT.trancheC.amountRatio)*100);

  document.getElementById("inputs").innerHTML = `
    <div class="card"><div class="sec-head"><span class="step">1</span><h3>카테고리 · 사업방식</h3></div>
      <div class="catgrid">${catBtns}</div><div class="moderow">${modeBtns}</div></div>
    <div class="card"><div class="sec-head"><span class="step">2</span><h3>면적 · 필수 요소</h3></div>
      ${fieldHtml("대지면적 (평)", INPUT.landPy, "landPy")}
      ${fieldHtml("연면적 (평)", INPUT.gfaPy, "gfaPy")}
      ${fieldHtml("전용률 (%)", Math.round(INPUT.efficiency*100), "efficiency%", 1, "학습")}
      ${reqFields}</div>
    <div class="card"><div class="sec-head"><span class="step">3</span><h3>사업비 단가</h3></div>
      ${fieldHtml(MODE==="valueadd"?"매입가 (만원/대지평)":"토지비 (만원/대지평)", INPUT.landPricePerPy, "landPricePerPy", 500)}
      ${fieldHtml("도급공사비 (만원/연면적평)", INPUT.constCostPerPy, "constCostPerPy", 50, "학습")}</div>
    <div class="card"><div class="sec-head"><span class="step">4</span><h3>조달 구조 (총사업비 대비)</h3></div>
      ${fieldHtml("Equity 비율 (%)", Math.round(INPUT.equityRatio*100), "equityRatio%")}
      ${trHtml("Tr.A",INPUT.trancheA,"trancheA")}${trHtml("Tr.B",INPUT.trancheB,"trancheB")}${trHtml("Tr.C",INPUT.trancheC,"trancheC")}
      <div class="note">합계 ${sumPct}% (100% 목표)</div></div>
    <div class="card"><div class="sec-head"><span class="step">5</span><h3>일정 (개월)</h3></div>
      ${fieldHtml("인허가·준비", INPUT.permitMonths, "permitMonths")}
      ${fieldHtml("공사", INPUT.constMonths, "constMonths")}
      ${fieldHtml("운영 (매각까지)", INPUT.opsMonths, "opsMonths")}</div>
    <div class="card"><div class="sec-head"><span class="step">6</span><h3>Exit</h3></div>
      ${fieldHtml("Terminal Cap (%)", (INPUT.exitCap*100).toFixed(1), "exitCap%", 0.1, "학습")}</div>`;

  // 이벤트 바인딩
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>reset(b.dataset.cat,MODE));
  document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>reset(CAT,b.dataset.mode));
  document.querySelectorAll("input[data-key]").forEach(inp=>inp.oninput=()=>{
    const k=inp.dataset.key, v=parseFloat(inp.value)||0;
    if (k.endsWith("%")) patch({[k.slice(0,-1)]: v/100});
    else patch({[k]: v});
  });
  document.querySelectorAll("input[data-tk]").forEach(inp=>inp.oninput=()=>{
    const v=(parseFloat(inp.value)||0)/(+inp.dataset.div);
    patchT(inp.dataset.tk, {[inp.dataset.tf]: v});
  });
}

function renderResults(){
  let r; try { r=computeCashflow(INPUT); } catch(e){ document.getElementById("results").innerHTML=`<div class="card">오류: ${esc(e.message)}</div>`; return; }
  const base = r.exits.find(e=>Math.abs(e.cap-INPUT.exitCap)<1e-6) || r.exits[0];
  const isSr = INPUT.category==="senior";

  const kpis = `<div class="kpis">
    <div class="kpi"><div class="l">총사업비</div><div class="v">${mm(r.ticTotal)}</div><div class="s">평당 ${r.ticPerGfaPy.toLocaleString()}만</div></div>
    <div class="kpi"><div class="l">Equity</div><div class="v">${mm(r.financing.equity)}</div><div class="s">LTC ${pct(r.financing.ltc,0)}</div></div>
    <div class="kpi"><div class="l">안정화 NOI</div><div class="v">${mm(r.stabilizedNoi)}</div><div class="s">Yield ${pct(r.yieldOnCost)}</div></div>
    <div class="kpi hi"><div class="l">Levered IRR</div><div class="v">${pct(base&&base.leveredIrr)}</div><div class="s">MoM ${base&&base.equityMultiple?base.equityMultiple.toFixed(2):"-"}x</div></div></div>`;

  const warns = r.warnings.length?`<div class="warns">${r.warnings.map(w=>`<div>⚠️ ${esc(w)}</div>`).join("")}</div>`:"";

  let ticRows=""; r.tic.forEach((l,i)=>{ const first=i===0||r.tic[i-1].category!==l.category;
    ticRows+=`<tr><td class="cat">${first?esc(l.category):""}</td>
      <td>${esc(l.name)}<span class="badge b${l.basis}">${l.basis}</span><div class="formula">${esc(l.formula)}</div></td>
      <td class="amt">${mm(l.amount)}</td></tr>`; });
  const ticCard = `<div class="card"><h3 class="title">총사업비 (TIC)</h3><table class="tic"><tbody>${ticRows}
    <tr class="total"><td colspan="2">합계</td><td class="amt">${mm(r.ticTotal)}</td></tr></tbody></table></div>`;

  const finCard = `<div class="card"><h3 class="title">조달</h3><div class="rows">
    <div><span>Equity (${pct(INPUT.equityRatio,0)})</span><span>${mm(r.financing.equity)}</span></div>
    ${r.financing.tranches.map(t=>`<div><span>${t.name} · ${pct(t.rate)} · 선취 ${pct(t.upfront)}</span><span>${mm(t.amount)}</span></div>`).join("")}
    <div class="bold"><span>총 대출</span><span>${mm(r.financing.totalDebt)}</span></div>
    <div class="muted"><span>누적 이자</span><span>${mm(r.financing.interestTotal)}</span></div>
    <div class="muted"><span>LTC</span><span>${pct(r.financing.ltc)}</span></div></div></div>`;

  const opRows = r.yearlyOps.map(y=>`<tr><td>${y.year}년차</td><td>${pct(y.rampup,0)}</td><td>${mm(y.gor)}</td><td>${mm(y.noi)}</td></tr>`).join("");
  const opCard = `<div class="card"><h3 class="title">운영 (연간 NOI)</h3><table class="optbl">
    <thead><tr><th>연차</th><th>램프업</th><th>GOR</th><th>NOI</th></tr></thead><tbody>${opRows}</tbody></table>
    ${r.dscr?`<div class="note">운영기간 DSCR: 최소 ${r.dscr.min.toFixed(2)} · 평균 ${r.dscr.avg.toFixed(2)}</div>`:""}</div>`;

  const exRows = r.exits.map(e=>`<tr class="${Math.abs(e.cap-INPUT.exitCap)<1e-6?'base':''}">
    <td>${pct(e.cap)}</td><td>${mm(e.salePrice)}</td>
    <td>${mm(e.profit)} <span style="color:var(--gray-400);font-size:10px">${pct(e.profitMargin,0)}</span></td>
    <td>${pct(e.unleveredIrr)}</td><td class="lirr">${pct(e.leveredIrr)}</td>
    <td>${e.equityMultiple?e.equityMultiple.toFixed(2):"-"}x</td></tr>`).join("");
  const exCard = `<div class="card"><h3 class="title">Exit 시나리오 ${isSr?"(보증금 회수형)":"(cap ±0.5%p)"}</h3><table class="optbl">
    <thead><tr><th>Cap</th><th>${isSr?"보증금수입":"매각가"}</th><th>사업이익</th><th>U-IRR</th><th>L-IRR</th><th>MoM</th></tr></thead>
    <tbody>${exRows}</tbody></table></div>`;

  const asum = `<div class="card"><h3 class="title">수입·운영 가정</h3>
    ${r.assumptions.map(a=>`<div class="asum"><div class="h">${esc(a.label)} <span class="badge b${a.basis}">${a.basis}</span></div>
      <div class="t">${esc(a.text)}</div>${a.src?`<div class="src">└ ${esc(a.src)}</div>`:""}</div>`).join("")}</div>`;

  document.getElementById("results").innerHTML = kpis+warns+ticCard+finCard+opCard+exCard+asum;
}

function renderAll(){ renderInputs(); renderResults(); }
renderAll();
</script>
